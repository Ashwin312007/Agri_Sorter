[transmitter]
gpio_chip = "/dev/gpiochip0"     # Pi 4 BCM2711 — GPIO header on gpiochip0
gpio_line = 18                    # BCM 18 → PWM0 channel
frequency_hz = 40000              # 40 kHz ultrasonic
burst_cycles = 8                  # 8-cycle tone burst

[receiver]
envelope_threshold = 200          # ADC raw counts above noise floor
timeout_us = 30000                # Max listen window (≈5 m round-trip)

[adc]
i2c_bus = 1
address = 0x48                    # ADS1115 default (ADDR→GND)
channel = 0                       # AIN0 single-ended
gain = 1                          # ±4.096 V FSR
data_rate = 860                   # Max ADS1115 rate (860 SPS)

[camera]
backend = "opencv"                # opencv | picamera2 | auto
device_index = 0
resolution = [1280, 720]

[conveyor]
belt_speed_mps = 0.12                # Recommended: 0.10 - 0.15 m/s
max_safe_speed_mps = 0.20            # Hard upper speed limit based on ADS1115 sampling rate
camera_to_ultrasonic_distance_m = 0.30
ultrasonic_to_sorter_distance_m = 0.25
sensor_mounting_height_mm = 240      # Transducer must be >= 220 mm to clear <=1.2ms blind zone
apex_sampling_window_mm = 35         # Measured zone on apple crown

[arduino]
port = "auto"
baud_rate = 115200
baseline_distance_mm = 240
fruit_threshold_mm = 30
timeout_s = 1.0
trig_pin = 9
echo_pin = 10
status_led_pin = 13



